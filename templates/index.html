<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinguaTranslate</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #777;
            font-size: 16px;
        }

        .language-section {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .language-box {
            flex: 1;
        }

        .language-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            background: white;
        }

        .text-section {
            display: flex;
            gap: 20px;
        }

        .text-box {
            flex: 1;
        }

        textarea {
            width: 100%;
            height: 220px;
            resize: none;
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        textarea:focus,
        select:focus {
            border-color: #667eea;
        }

        .box-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        .button-area {
            text-align: center;
            margin: 25px 0;
        }

        button {
            border: none;
            background: #667eea;
            color: white;
            padding: 14px 35px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .copy-button {
            margin-top: 10px;
            background: #764ba2;
            padding: 10px 25px;
            font-size: 14px;
        }

        .copy-button:hover {
            background: #643d89;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            color: #666;
        }

        @media (max-width: 700px) {
            .language-section,
            .text-section {
                flex-direction: column;
            }

            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🌐 LinguaTranslate</h1>
            <p>Translate text quickly and easily</p>
        </div>

        <div class="language-section">

            <div class="language-box">
                <label for="source">Source Language</label>

                <select id="source">
                    <option value="auto">Auto Detect</option>

                    {% for name, code in languages.items() %}
                    <option value="{{ code }}">{{ name }}</option>
                    {% endfor %}

                </select>
            </div>

            <div class="language-box">
                <label for="target">Target Language</label>

                <select id="target">

                    {% for name, code in languages.items() %}

                    <option value="{{ code }}"
                        {% if code == "en" %}selected{% endif %}>
                        {{ name }}
                    </option>

                    {% endfor %}

                </select>
            </div>

        </div>


        <div class="text-section">

            <div class="text-box">

                <div class="box-title">
                    Enter Text
                </div>

                <textarea
                    id="inputText"
                    placeholder="Type or paste your text here..."></textarea>

            </div>


            <div class="text-box">

                <div class="box-title">
                    Translation
                </div>

                <textarea
                    id="outputText"
                    placeholder="Your translation will appear here..."
                    readonly></textarea>

                <button
                    class="copy-button"
                    onclick="copyTranslation()">
                    📋 Copy
                </button>

            </div>

        </div>


        <div class="button-area">

            <button onclick="translateText()">
                Translate
            </button>

        </div>

        <div id="status"></div>

    </div>


    <script>

        async function translateText() {

            const text =
                document.getElementById("inputText").value.trim();

            const source =
                document.getElementById("source").value;

            const target =
                document.getElementById("target").value;

            const output =
                document.getElementById("outputText");

            const status =
                document.getElementById("status");


            if (!text) {

                status.innerText =
                    "Please enter some text first.";

                return;
            }


            status.innerText =
                "Translating...";

            output.value = "";


            try {

                const response = await fetch("/translate", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        text: text,
                        source: source,
                        target: target

                    })

                });


                const data = await response.json();


                if (data.success) {

                    output.value =
                        data.translation;

                    status.innerText =
                        "Translation completed successfully.";

                } else {

                    status.innerText =
                        data.message;

                }

            } catch (error) {

                status.innerText =
                    "Something went wrong. Please try again.";

                console.error(error);

            }

        }


        function copyTranslation() {

            const output =
                document.getElementById("outputText");

            if (!output.value) {

                alert("There is no translation to copy.");

                return;
            }


            navigator.clipboard.writeText(output.value);

            alert("Translation copied!");

        }

    </script>

</body>

</html>
